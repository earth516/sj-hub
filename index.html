    <div class="rows">${list.map(s => {
      const sm = noteOf(s.id, x.key, 'summary'), ox = noteOf(s.id, x.key, 'ox');
      const times = sm ? (fmtTime(sm.first) === fmtTime(sm.last) ? `제출 ${fmtTime(sm.first)}` : `처음 ${fmtTime(sm.first)} · 수정 ${fmtTime(sm.last)}`) : '';
      const flat = sm ? sm.text.replace(/\s+/g, '').toLowerCase() : '';
      return `<div class="drow ${sm ? '' : 'miss'}">
        <div class="who"><b>${esc(s.name)}</b><span>${esc(s.id)}</span></div>
        <div class="txt"><span class="body">${sm ? esc(sm.text) : '미제출'}</span>${sm && kws.length ? `<div class="kw">${kws.map(w => `<span class="${flat.includes(w.replace(/\s+/g, '').toLowerCase()) ? 'hit' : ''}">${esc(w)}</span>`).join('')}</div>` : ''}
${times ? `<div class="tm">${times}</div>` : ''}${fbForm(s.id, x.key)}</div>
        <div class="sc">${ox ? `OX <b>${esc(ox.text)}</b>` : '<span class="muted">OX -</span>'}</div>
      </div>`;
    }).join('') || '<p class="muted">해당하는 학생이 없어요.</p>'}</div>`;
}
window.copyMissing = async () => {
  const x = lessonUnits().find(v => v.key === dashState.unit);
  const names = curStuds().filter(s => !noteOf(s.id, x.key, 'summary')).map(s => s.name).join(', ');
  try { await navigator.clipboard.writeText(names); toast('미제출 학생 이름을 복사했어요.'); } catch { toast(names); }
};

const PRESETS = ['핵심 개념을 정확히 정리했어요.', '제시어를 모두 활용해 잘 정리했어요.', '제시어를 더 넣어서 다시 정리해 보세요.', '원인과 결과를 연결해서 써 보세요.', '내용이 부족해요. 개념 요약을 다시 읽고 고쳐 써 보세요.'];
function fbForm(sid, unit) {
  const sc0 = (noteOf(sid, unit, 'fbScore') || {}).text || '', cm = (noteOf(sid, unit, 'fbComment') || {}).text || '';
  return `<div class="fbx" data-sid="${esc(sid)}" data-score="${esc(sc0)}">
    <div class="sbs" role="group" aria-label="점수 (5점 만점)">${[0, 1, 2, 3, 4, 5].map(n => `<button class="${String(n) === sc0 ? 'on' : ''}" onclick="pickScore(this,${n})" aria-label="${n}점">${n}</button>`).join('')}</div>
    <select aria-label="빠른 코멘트" onchange="usePreset(this)"><option value="">빠른 코멘트</option>${PRESETS.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <input data-f="comment" value="${esc(cm)}" placeholder="학생에게 보일 한 줄 코멘트" maxlength="300" onkeydown="if(event.key==='Enter')saveFb(this)">
    <button class="btn sm" onclick="saveFb(this)">저장</button><span class="st">${sc0 || cm ? '저장됨' : ''}</span></div>`;
}
window.pickScore = (btn, n) => {   // 점수 버튼을 누르면 바로 저장돼요 (같은 점수를 다시 누르면 비움)
  const box = btn.closest('.fbx'), same = box.dataset.score === String(n);
  box.dataset.score = same ? '' : String(n);
  box.querySelectorAll('.sbs button').forEach(b => b.classList.toggle('on', !same && b === btn));
  saveFb(box);
};
window.usePreset = sel => {
  if (!sel.value) return;
  const box = sel.closest('.fbx'); box.querySelector('[data-f="comment"]').value = sel.value; sel.value = '';
  saveFb(box);
};
window.saveFb = async el => {
  const box = el.closest('.fbx'), sid = box.dataset.sid, st = box.querySelector('.st');
  const score = box.dataset.score || '', comment = box.querySelector('[data-f="comment"]').value.trim();
  st.textContent = '저장 중…';
  try {
    const r = await api('feedback', { sid, unit: dashState.unit, score, comment });
    if (!r.ok) throw new Error(r.error);
    [['fbScore', score], ['fbComment', comment]].forEach(([f, v]) => {
      const n = noteOf(sid, dashState.unit, f);
      if (n) n.text = v; else dashData.notes.push({ id: sid, unit: dashState.unit, field: f, text: v });
    });
    st.textContent = '저장됨';
    const t = $('fb-tile'), tmp = document.createElement('div');   // 평균 점수 칸만 다시 계산
    tmp.innerHTML = dashBody(); const nt = tmp.querySelector('#fb-tile'); if (t && nt) t.innerHTML = nt.innerHTML;
  } catch (e) { if (e.message !== 'EXPIRED') st.textContent = '저장 실패'; }
};

/* ② 문항별 정답률 */
function dashItems(x, studs) {
  const qs = (oxBlockOf(x.L) || { ox: [] }).ox;
  const det = studs.map(s => noteOf(s.id, x.key, 'oxDetail')).filter(Boolean).map(n => n.text);
  if (!det.length) return '<p class="muted">아직 OX를 푼 학생이 없어요.</p>' + confuseStats(x, studs);
  return `<p class="muted" style="margin:0 0 12px">${det.length}명 응시 · 정답률이 낮은 문항은 빨간색으로 표시돼요.</p>
    <div class="items">${qs.map((q, i) => {
      const n = det.filter(d => d[i] === '1').length, pct = Math.round(n / det.length * 100);
      return `<div class="item ${pct < 60 ? 'low' : ''}">
        <div class="iq">${i + 1}. ${q.q} <span class="ans">정답 ${q.a !== undefined ? (q.a ? 'O' : 'X') : (((dashData.oxKey || {})[x.u.code] || [])[i] || '?')}</span></div>
        <div class="ibar"><i style="width:${pct}%"></i></div>
        <div class="ip"><b>${pct}%</b> <span>${n}/${det.length}명</span></div>
      </div>`;
    }).join('')}</div>${confuseStats(x, studs)}`;
}
function confuseStats(x, studs) {
  const blk = x.L.steps.flatMap(st => st.blocks).find(b => b.confuse);
  if (!blk) return '';
  const picks = studs.map(s => noteOf(s.id, x.key, 'confuse')).filter(Boolean).map(n => n.text);
  if (!picks.length) return '<h2>학생들이 헷갈린 개념</h2><p class="muted">아직 고른 학생이 없어요.</p>';
  const max = Math.max(...blk.confuse.map(c => picks.filter(p => p === c).length));
  return `<h2>학생들이 헷갈린 개념 <small class="muted" style="font-size:13px;font-weight:500">${picks.length}명 응답</small></h2>
    <div class="items">${blk.confuse.map(c => {
      const n = picks.filter(p => p === c).length, pct = Math.round(n / picks.length * 100);
      return `<div class="item ${n && n === max && !c.includes('없음') ? 'low' : ''}"><div class="iq">${esc(c)}</div><div class="ibar"><i style="width:${pct}%"></i></div><div class="ip"><b>${n}명</b> <span>${pct}%</span></div></div>`;
    }).join('')}</div>`;
}

/* ③ 학생별 포트폴리오 */
function dashStudent(x, studs) {
  if (!dashState.student || !studs.find(s => s.id === dashState.student)) dashState.student = studs[0] ? studs[0].id : '';
  const st = studs.find(s => s.id === dashState.student);
  return `<label class="pick">학생 <select onchange="setDash('student',this.value)">${studs.map(s => `<option value="${esc(s.id)}" ${s.id === dashState.student ? 'selected' : ''}>${esc(s.id)} ${esc(s.name)}</option>`).join('')}</select></label>
    ${!st ? '' : `<div class="pf-list">${lessonUnits().map(u => {
      const sm = noteOf(st.id, u.key, 'summary'), ox = noteOf(st.id, u.key, 'ox'), d = noteOf(st.id, u.key, 'oxDetail'), q = noteOf(st.id, u.key, 'question');
      return `<div class="pf-card" style="--c:${sc(u.s)}">
        <div class="pf-top"><div><div class="code">${esc(u.s.title)} ${esc(u.u.code)}</div><b>${esc(u.u.title)}</b></div>
          <div class="pf-score">${ox ? `OX <b>${esc(ox.text)}</b>${d ? `<div class="oxd">${[...d.text].map(c => c === '1' ? '○' : '×').join(' ')}</div>` : ''}` : '<span class="muted">OX 미응시</span>'}</div></div>
        <div class="pf-sum">${sm ? esc(sm.text) : '<span class="muted">개념 정리 미제출</span>'}</div>
        ${sm ? `<div class="tm">처음 ${fmtTime(sm.first)}${fmtTime(sm.first) !== fmtTime(sm.last) ? ` · 수정 ${fmtTime(sm.last)}` : ''}</div>` : ''}
        ${noteOf(st.id, u.key, 'confuse') ? `<div class="tm">헷갈린 개념: ${esc(noteOf(st.id, u.key, 'confuse').text)}</div>` : ''}
        ${q && q.text ? `<div class="tm">${ic('chat')} 질문: ${esc(q.text)}</div>` : ''}
        ${dashState.unit === u.key ? fbForm(st.id, u.key) : fbBox((noteOf(st.id, u.key, 'fbScore') || {}).text, (noteOf(st.id, u.key, 'fbComment') || {}).text)}
      </div>`;
    }).join('')}</div>`}`;
}

/* ④ 학생 질문 */
function dashQuestions(x, studs) {
  const rows = studs.map(s => ({ s, n: noteOf(s.id, x.key, 'question') })).filter(r => r.n && r.n.text);
  if (!rows.length) return '<p class="muted">아직 남긴 질문이 없어요. 학생이 점검 마지막에 적은 “궁금한 점”이 여기에 모여요.</p>';
  return `<div class="rows">${rows.map(({ s, n }) => `<div class="qrow"><div class="who"><b>${esc(s.name)}</b><span>${esc(s.id)}</span></div><div class="qt">${esc(n.text)}<div class="tm">${fmtTime(n.last || n.first)}</div></div></div>`).join('')}</div>`;
}

/* ⑤ 한눈에 보기 (학생 × 단원) */
function dashGrid(x, studs) {
  const units = lessonUnits();
  return `<div style="overflow-x:auto"><table class="lt" style="min-width:520px"><thead><tr><th>학번</th><th>이름</th>${units.map(u => `<th>${esc(u.u.code)} ${esc(u.u.title)}</th>`).join('')}</tr></thead>
    <tbody>${studs.map(s => `<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td>${units.map(u => {
      const sm = noteOf(s.id, u.key, 'summary'), ox = noteOf(s.id, u.key, 'ox'), fb = noteOf(s.id, u.key, 'fbScore');
      let low = false; if (ox) { const [g, t] = ox.text.split('/').map(Number); low = t && g / t < .6; }
      return `<td>${sm ? ic('check') : '<span class="muted">–</span>'} <span style="${low ? 'color:var(--coral);font-weight:700' : ''}">${ox ? esc(ox.text) : ''}</span>${fb && fb.text !== '' ? ` <span class="muted">· ${esc(fb.text)}점</span>` : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12.5px">✓ 개념 정리 제출 · OX 점수 · 선생님 채점 점수 (OX 정답률 60% 미만은 빨간색)</p>`;
}

/* 엑셀(CSV)로 내려받기 — 지금 고른 단원·반 */
window.exportCsv = () => {
  const x = lessonUnits().find(v => v.key === dashState.unit); if (!x) return;
  const studs = curStuds(), qs = (oxBlockOf(x.L) || { ox: [] }).ox;
  const g = (id, f) => (noteOf(id, x.key, f) || {});
  const head = ['학번', '이름', '개념 정리', '처음 제출', '마지막 수정', 'OX 점수', ...qs.map((_, i) => `OX ${i + 1}번 결과`), '헷갈린 개념', '궁금한 점', '선생님 점수', '선생님 코멘트'];
  const rows = studs.map(s => {
    const d = g(s.id, 'oxDetail').text || '';
    return [s.id, s.name, g(s.id, 'summary').text || '', fmtTime(g(s.id, 'summary').first), fmtTime(g(s.id, 'summary').last), g(s.id, 'ox').text || '',
      ...qs.map((_, i) => d[i] === '1' ? '정답' : d[i] === '0' ? '오답' : ''), g(s.id, 'confuse').text || '', g(s.id, 'question').text || '', g(s.id, 'fbScore').text || '', g(s.id, 'fbComment').text || ''];
  });
  const cell = c => { let t = String(c ?? ''); if (/^[=+\-@]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
  const csv = '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `${x.s.title}_${x.u.code}_${dashState.cls || '전체'}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('엑셀에서 열 수 있는 파일을 내려받았어요.');
};

/* ---------- 반별 진도 공개 (선생님) ---------- */
let openData = null;
window.toggleOpenPanel = async () => {
  dashState.openPanel = !dashState.openPanel;
  if (dashState.openPanel && !openData) { toast('불러오는 중…'); await loadOpen(); }
  const el = $('open-panel'); if (el) el.innerHTML = dashState.openPanel && openData ? openPanelHtml() : '';
};
async function loadOpen() {
  try { const r = await api('openGet'); if (!r.ok) throw new Error(r.error); openData = r; if (!dashState.ocls) dashState.ocls = (r.classes || [])[0] || ''; }
  catch (e) { if (e.message !== 'EXPIRED') toast('진도 공개 정보를 불러오지 못했어요. ' + (e.message || '')); }
}
function openPanelHtml() {
  const o = openData, cls = dashState.ocls, on = c => !!(o.map[c.code] && o.map[c.code][cls]);
  if (!o.classes.length) return `<div class="oppanel"><p>학생명단에 학생을 먼저 넣고, 구글 시트 메뉴 [SJ 대시보드 → 진도 공개 표 만들기·새로고침]을 눌러 주세요.</p></div>`;
  const rows = o.units.filter(u => o.map[u.code]);
  return `<div class="oppanel">
    <div class="oprow-top">
      <label>반 <select onchange="dashState.ocls=this.value;document.getElementById('open-panel').innerHTML=openPanelHtml()">${o.classes.map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label>주차 <input id="op-week" type="number" min="0" style="width:70px"></label>
      <button class="btn" onclick="openByWeekUi()">${ic('check')} 이 주차까지 열기</button>
      <span class="mini-note">단원마다 주차는 구글 시트 [진도공개] 탭의 '주차' 칸에 써요.</span>
    </div>
    <div class="opgrid">${rows.map(u => `<label class="opitem"><input type="checkbox" ${on(u) ? 'checked' : ''} onchange="openToggle('${esc(u.code)}',this.checked)"><span><b>${esc(u.code)}</b> ${esc(u.title)} <small>${esc(u.subject || '')}${u.week ? ' · ' + esc(u.week) + '주차' : ''}</small></span></label>`).join('') || '<p>표에 단원이 없어요. 시트 메뉴에서 새로고침을 눌러 주세요.</p>'}</div>
  </div>`;
}
window.openToggle = async (code, on) => {
  const cls = dashState.ocls;
  try {
    const r = await api('openSet', { code, cls, on }); if (!r.ok) throw new Error(r.error);
    (openData.map[code] = openData.map[code] || {})[cls] = on; toast(`${cls}: ${on ? '열었어요' : '닫았어요'}`);
  } catch (e) { toast('바꾸지 못했어요.'); loadOpen().then(() => { const el = $('open-panel'); if (el) el.innerHTML = openPanelHtml(); }); }
};
window.openByWeekUi = async () => {
  const w = ($('op-week') || {}).value;
  if (w === '' || w == null) { toast('주차를 숫자로 써 주세요.'); return; }
  const r = await api('openWeek', { cls: dashState.ocls, week: w });
  if (!r.ok) { toast(r.error || '실패했어요.'); return; }
  await loadOpen(); const el = $('open-panel'); if (el) el.innerHTML = openPanelHtml();
  toast(`${dashState.ocls}: ${w}주차까지 열었어요. (${r.changed}칸 바뀜)`);
};

async function loadDash() {
  try {
    const r = await api('dash');
    if (!r.ok) throw new Error(r.error);
    dashData = { students: r.students || [], notes: r.notes || [], oxKey: r.oxKey || {} };
    if (location.hash.startsWith('#/dash')) route();
  } catch (e) {
    if (e.message !== 'EXPIRED') $('app').innerHTML = `<h1>선생님 대시보드</h1><p class="lead">기록을 불러오지 못했어요. (${esc(e.message)})</p>`;
  }
}

/* ============================================================
   주소(#/과목/단원)에 따라 화면 고르기
   ============================================================ */
function route() {
  const [sid, code] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  const s = sid && subjectById(sid);
  const u = s && code && allUnits(s).find(x => x.code === code);
  curUnit = null;
  const isLesson = !!(u && u.lesson);
  document.body.classList.toggle('lesson-mode', isLesson);
  sky.set(!isLesson && sid !== 'dash' && sid !== 'me');
  if (sid === 'me') { $('app').innerHTML = viewPortfolio(); return; }
  if (sid === 'dash') { $('app').innerHTML = viewDash(); return; }
  if (isLesson) {
    $('app').innerHTML = viewLesson(s, u, LESSONS[u.lesson]);
    if (curUnit) afterLesson();
    return;
  }
  if (u && u.locked) { $('app').innerHTML = `<div class="crumbs"><a href="#/">홈</a>${ic('right')}<a href="#/${s.id}">${esc(s.title)}</a></div><h1>${esc(u.title)}</h1><div class="banner">${ic('lock')} 아직 열리지 않은 단원이에요.${u.week ? ` ${esc(u.week)}주차에 열려요.` : ''} 선생님이 열어 주면 시작할 수 있어요.</div><a class="btn" href="#/${s.id}">단원 목록으로</a>`; return; }
  $('app').innerHTML = u ? viewUnit(s, u) : s ? viewSubject(s) : viewHome();
}
let lastHash = location.hash;
window.addEventListener('hashchange', () => { route(); if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; });

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 시작 ---------- */
renderUser();
loadDrafts();
loadContent().then(route);
if (session) {   // 저장된 출입증으로 기록 불러오기
  api('progress').then(r => { if (r.ok) { done = new Set(r.done || []); if (curUnit) refreshDone(); else route(); } }).catch(() => { });
}

</script>
</body>
