<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SJ SCIENCE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  color-scheme:dark;
  --paper:#0a1118; --surface:#101a24; --raise:#15212d; --sunk:#0d151d;
  --ink:#e8eff5; --body:#a8b8c7; --faint:#7389a0;
  --line:#1f2f3e; --line-soft:#18242f;
  --sea:#62cfc2; --sea-soft:rgba(98,207,194,.12);
  --coral:#ef7a69; --ok:#4fd98a; --warn:#f0b955;
  --sky-rgb:255,255,255; --head:#0c141c; --glass:rgba(10,17,24,.94); --strong:#fff; --on-sea:#06201d;
}
:root[data-theme="light"]{
  color-scheme:light;
  --paper:#eef2f6; --surface:#ffffff; --raise:#f6f9fb; --sunk:#e7edf2;
  --ink:#111f2b; --body:#41556a; --faint:#667b8f;
  --line:#d4dfe8; --line-soft:#e4ebf1;
  --sea:#0a7d73; --sea-soft:rgba(10,125,115,.09);
  --coral:#c24334; --ok:#15803d; --warn:#a16207;
  --sky-rgb:10,95,110; --head:#ffffff; --glass:rgba(238,242,246,.94); --strong:#000; --on-sea:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;letter-spacing:-.01em;word-break:keep-all;min-height:100vh;-webkit-text-size-adjust:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 머리글 */
header{position:sticky;top:0;z-index:20;background:var(--head);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:52px;display:flex;align-items:center;gap:6px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none}
.brand img{width:26px;height:26px;object-fit:contain}
.brand b{font-size:16px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.spacer{flex:1}
.userbox{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--body)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);color:var(--on-sea);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.icon-btn{padding:7px 8px}
.uname{display:inline-flex;align-items:center;gap:5px;padding:0 4px}

main{max-width:1080px;margin:0 auto;padding:26px 18px 56px}
.crumbs{font-size:13px;color:var(--faint);margin-bottom:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--body)}
.crumbs a:hover{color:var(--sea)}
h1{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:28px 0 10px;font-weight:700}
.lead{color:var(--body);margin:0 0 20px;font-size:14.5px}
.banner{background:var(--sea-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--body);margin-bottom:18px}
.banner b{color:var(--sea)}
.muted{color:var(--faint)}

/* 홈 · 과목 */
.subjs{display:flex;flex-direction:column;gap:10px}
.subj{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;transition:border-color .15s,background .15s}
.subj:hover{border-color:var(--c);background:var(--raise)}
.tile-ic{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--sea)) 15%,transparent);color:var(--c,var(--sea));font-size:21px}
.subj .t{flex:1;min-width:0}
.subj h3{margin:0;font-size:16.5px;font-weight:700}
.subj p{margin:1px 0 0;color:var(--faint);font-size:13px}
.subj .go{color:var(--faint);font-size:13px;display:flex;align-items:center;gap:8px}
.ring{color:var(--ink);flex:none}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.lk{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--surface);transition:border-color .15s}
.lk:hover{border-color:var(--sea)}
.lk .i{font-size:18px;color:var(--sea)}
.lk b{display:block;font-size:13.5px;font-weight:600}
.lk span{display:block;font-size:12px;color:var(--faint)}
.head-ic{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.head-ic .tile-ic{width:36px;height:36px;font-size:19px}
.chap{margin:24px 0 8px;font-size:14px;font-weight:700;color:var(--body)}
.urows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.urow{display:flex;align-items:center;gap:12px;padding:11px 16px;text-decoration:none;border-top:1px solid var(--line-soft);transition:background .12s}
.urow:first-child{border-top:0}
.urow:hover{background:var(--raise)}
.urow .code{font-size:12px;color:var(--faint);width:54px;flex:none;font-variant-numeric:tabular-nums}
.urow .t{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.urow .mini{display:flex;gap:7px;color:var(--faint);font-size:14px}
.urow .end{flex:none;display:flex;align-items:center;gap:8px;min-width:34px;justify-content:flex-end;color:var(--faint)}
.tag{font-size:11.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:2px 8px;border-radius:99px;white-space:nowrap}
.mp{width:46px;height:5px;background:var(--sunk);border-radius:9px;overflow:hidden}
.mp i{display:block;height:100%;background:var(--c,var(--sea));border-radius:9px}
.code{font-size:12px;color:var(--faint);font-weight:600}
.prog{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--c,var(--sea));border-radius:99px;transition:width .3s}
.prog-t{font-size:12px;color:var(--faint);margin-top:5px}

/* 링크형 단원 */
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.step.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:800;font-size:14px;color:var(--c,var(--sea))}
.step.done .num{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.step .info{flex:1;min-width:0}
.step .type{font-size:12px;font-weight:700;color:var(--c,var(--sea));display:flex;align-items:center;gap:5px}
.step .t{font-size:15px;font-weight:600}
.step .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.check.on{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:var(--ok);color:var(--ok)}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.flow span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--body);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}

/* 로그인 · 알림 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,8,12,.72);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:100%;max-width:380px;padding:26px}
.panel h3{margin:0 0 4px;font-size:20px}
.panel .hint{color:var(--faint);font-size:13.5px;margin:0 0 16px}
.panel label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 6px;color:var(--body)}
.panel input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:16px}
.err{color:var(--coral);font-size:13.5px;min-height:20px;margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:6px}
.row .btn{flex:1;justify-content:center;padding:11px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;text-align:center;padding:20px 16px}
footer a{color:var(--body)}

/* 할 일 · 현황 */
.todo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px}
.todo h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:7px}
.todo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;padding:9px 12px;border-radius:9px;background:var(--sunk);font-size:14px}
.todo li a:hover{outline:1px solid var(--sea)}
.todo li small{color:var(--faint);font-size:12px}
.todo .clear{color:var(--ok);font-weight:600;display:flex;align-items:center;gap:6px;font-size:14px}
.fbnote{margin-top:10px;font-size:13.5px;color:var(--body)}
.fbnote a{color:var(--sea)}
.mystat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mystat span{font-size:12.5px;color:var(--body);background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.mystat b{color:var(--ink)}

/* ============ 학습 화면 (한 화면에 한 장씩) ============ */
body.lesson-mode{height:100vh;height:100dvh;overflow:hidden}
body.lesson-mode footer{display:none}
body.lesson-mode main{max-width:none;padding:0;height:calc(100vh - 53px);height:calc(100dvh - 53px)}
.lesson{height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column;padding:0 18px;font-size:calc(15px * var(--fz,1))}
.ls-top{display:flex;align-items:center;gap:10px;padding:10px 0 4px}
.ls-back{display:inline-flex;align-items:center;gap:3px;text-decoration:none;color:var(--body);font-size:13px;white-space:nowrap}
.ls-back:hover{color:var(--c)}
.ls-title{flex:1;min-width:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls-title .code{margin-right:8px}
.ls-tools{display:flex;gap:4px;align-items:center;color:var(--faint);font-size:12.5px}
.ls-steps{display:flex;gap:8px;padding:6px 0 10px}
.stp{flex:1 1 0;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--faint);font-size:12.5px;font-weight:600}
.stp .lab{display:flex;align-items:center;gap:5px;margin-bottom:6px;white-space:nowrap;overflow:hidden}
.stp .lab .tx{overflow:hidden;text-overflow:ellipsis}
.stp .band{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.stp .band i{display:block;height:100%;width:var(--p,0%);background:var(--c);border-radius:3px;transition:width .35s}
.stp.cur{color:var(--ink)}
.stp.ok .lab{color:var(--ok)}
.stp.ok .band i{background:var(--ok)}
.stp:hover .lab{color:var(--ink)}
.ls-stage{flex:1;min-height:0;position:relative}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:none;padding:4px 2px 12px;scrollbar-width:thin}
.slide.on{display:block;animation:slin .24s ease-out}
.slide.back.on{animation-name:slinb}
@keyframes slin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slinb{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.sin{min-height:100%;display:flex;flex-direction:column;justify-content:center;max-width:860px;margin:0 auto}
.sh{display:flex;align-items:center;gap:7px;color:var(--c);font-weight:700;font-size:.88em;margin-bottom:6px}
.stitle{font-size:1.5em;font-weight:800;line-height:1.35;margin:0 0 16px;letter-spacing:-.02em}
.ls-nav{display:flex;align-items:center;gap:12px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft)}
.ls-nav .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--faint)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:width .2s,background .2s}
.dots i.past{background:color-mix(in srgb,var(--c) 55%,var(--line))}
.dots i.on{background:var(--c);width:20px;border-radius:3px}
.ls-nav .btn{min-width:104px;justify-content:center;padding:11px 16px;font-size:15px;border-radius:11px}
.ls-nav .btn.primary{background:var(--c);color:var(--on-sea)}
.ls-nav .btn.hide{visibility:hidden}

/* 읽기 장 */
.read{display:grid;gap:24px;align-items:center}
.read.has-img{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.read-img figure{margin:0}
.read-img a,figure a{display:block;background:#fff;border-radius:12px;padding:8px;cursor:zoom-in}
.read-img img,figure img{display:block;width:100%;height:auto;max-height:calc(100dvh - 300px);object-fit:contain;border-radius:6px}
figure{margin:0 0 14px}
figcaption{font-size:.85em;color:var(--faint);margin-top:8px;text-align:center}
:root[data-theme="light"] figure a{border:1px solid var(--line)}
.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.pts li{padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;line-height:1.65}
.pts b{color:var(--strong)}
.rbody p{margin:0 0 12px;line-height:1.7}
.rbody h4{font-size:1.05em;margin:18px 0 8px;color:var(--c)}
.rbody ul{margin:0 0 12px;padding-left:20px}
.rbody li{margin-bottom:5px}

/* 쓰기 장 */
.wr label.q{display:block;font-size:1.1em;font-weight:700;line-height:1.5;margin-bottom:10px}
.wr textarea{width:100%;height:clamp(130px,28dvh,250px);resize:vertical;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1em;line-height:1.7}
.wr textarea:focus{border-color:var(--c);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.hint{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85em;color:var(--faint);margin:0 0 10px}
.hint span{background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:2px 11px;color:var(--body);transition:all .15s}
.hint span.hit{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent)}
.hint span.hit::before{content:'✓ '}
.hint em{font-style:normal;margin-left:4px}
.wrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.wrow .cnt{font-size:.82em;color:var(--faint)}
.wst{font-size:.85em;color:var(--faint);flex:1}
.wst.ok{color:var(--ok)}
.model{display:none;background:var(--sunk);border:1px dashed var(--c);border-radius:12px;padding:12px 15px;margin:14px 0 0;font-size:.95em;line-height:1.7}
.model .lab{font-size:.85em;font-weight:700;color:var(--c);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.model .tip{font-size:.85em;color:var(--faint);margin:8px 0 0}

/* 뉴스 장 */
.newsc{max-width:740px;margin:0 auto;width:100%}
.newsc h3{margin:0 0 4px;font-size:1.35em;font-weight:800;line-height:1.4;letter-spacing:-.02em}
.newsc .src{font-size:.82em;color:var(--faint);margin-bottom:12px}
.newsc .sum{margin:0 0 14px;line-height:1.75;color:var(--body)}
.think{background:var(--sea-soft);border-left:3px solid var(--c);border-radius:10px;padding:12px 15px;margin:0 0 12px;line-height:1.65}
.think b{display:flex;align-items:center;gap:6px;color:var(--c);margin-bottom:3px;font-size:.92em}
.ans{display:none;background:var(--sunk);border-radius:12px;padding:12px 15px;margin:0 0 12px;line-height:1.7;font-size:.97em}
.ans.show{display:block;animation:slin .2s ease-out}
.newsc .acts{display:flex;gap:8px;flex-wrap:wrap}

/* OX 장 */
.oxq{text-align:center;max-width:640px;margin:0 auto;width:100%}
.oxq .n{font-size:.85em;color:var(--faint);margin-bottom:14px;font-weight:600}
.oxq .qt{font-size:1.35em;font-weight:700;line-height:1.65;margin:0 0 28px;letter-spacing:-.015em;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.oxbtns{display:flex;gap:16px;justify-content:center}
.oxbtn{width:clamp(96px,24vw,132px);height:clamp(96px,24vw,132px);border-radius:24px;border:2px solid var(--line);background:var(--surface);font-size:46px;font-weight:800;line-height:1;position:relative;transition:transform .12s,border-color .15s,background .15s;color:var(--body)}
.oxbtn:hover{transform:translateY(-2px);border-color:var(--faint)}
.oxbtn.sel.o{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.oxbtn.sel.x{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,transparent);color:var(--coral)}
.oxbtn.right::after,.oxbtn.wrong::after{position:absolute;right:-8px;top:-8px;width:26px;height:26px;border-radius:50%;font-size:14px;display:grid;place-items:center;color:#fff;font-weight:800}
.oxbtn.right{border-color:var(--ok)}.oxbtn.right::after{content:'✓';background:var(--ok)}
.oxbtn.wrong{border-color:var(--coral)}.oxbtn.wrong::after{content:'✗';background:var(--coral)}
.oxq .hintkey{margin-top:22px;font-size:.8em;color:var(--faint)}
.sumbox{max-width:680px;margin:0 auto;width:100%}
.sumrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px;text-align:left;width:100%;font-size:.95em}
button.sumrow:hover{border-color:var(--c)}
.sumrow .ix{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:.85em;font-weight:700;color:var(--faint)}
.sumrow .tx{flex:1;min-width:0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sumrow .pk{flex:none;font-weight:800;font-size:1.1em;min-width:28px;text-align:center}
.sumrow .pk.none{color:var(--warn)}
.res{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 13px;margin-bottom:8px;display:flex;gap:11px;text-align:left;font-size:.93em;line-height:1.6}
.res .mk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.85em;margin-top:1px}
.res.ok .mk{background:var(--ok)}.res.no .mk{background:var(--coral)}
.res.no{border-color:color-mix(in srgb,var(--coral) 50%,var(--line))}
.res .rq{font-weight:600}
.res .rx{color:var(--body);font-size:.95em;margin-top:2px}
.scorebox{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.scorebox .big{font-size:2.8em;font-weight:800;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.scorebox .sub{font-size:.9em;color:var(--body);line-height:1.55}
.res-ok{color:var(--ok);font-weight:700}
.res-no{color:var(--coral);font-weight:700}

/* 헷갈린 개념 · 질문 */
.confuse{display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;width:100%}
.confuse button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:1em;text-align:left;display:flex;align-items:center;gap:10px;transition:border-color .15s}
.confuse button::before{content:'';flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.confuse button:hover{border-color:var(--faint)}
.confuse button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);font-weight:700}
.confuse button.on::before{border-color:var(--c);background:var(--c);box-shadow:inset 0 0 0 3px var(--surface)}

/* 마무리 장 */
.dn{max-width:640px;margin:0 auto;width:100%}
.dn-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dn-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-size:26px}
.dn-badge.wait{background:var(--sunk);color:var(--faint)}
.dn-h h3{margin:0;font-size:1.4em;font-weight:800;letter-spacing:-.02em}
.dn-h p{margin:2px 0 0;color:var(--body);font-size:.92em}
.dn-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.dn-row{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.95em;width:100%;text-align:left}
button.dn-row:hover{border-color:var(--c)}
.dn-row .st{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--faint);font-size:12px}
.dn-row.ok .st{background:var(--ok);color:#fff}
.dn-row .k{flex:1;font-weight:600}
.dn-row .v{color:var(--body);font-size:.92em;max-width:55%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dn-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fb{background:var(--sea-soft);border:1px solid color-mix(in srgb,var(--sea) 50%,var(--line));border-radius:12px;padding:11px 15px;margin:0 0 14px;font-size:.95em}
.fb .lab{font-size:.85em;font-weight:700;color:var(--sea);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.fb b.sc{font-size:1.2em;color:var(--sea)}
.lgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin:6px 0 4px}
.lcard{border:1px solid var(--line);border-radius:12px;padding:11px 14px;text-decoration:none;display:block;background:var(--surface)}
.lcard:hover{border-color:var(--c,var(--sea))}
.lcard.off{opacity:.55;pointer-events:none}
.lcard b{display:block;font-size:.95em}
.lcard span{font-size:.82em;color:var(--faint)}

/* 공용 블록 (표·접기·연결하기) */
table.lt{border-collapse:collapse;width:100%;margin:4px 0 14px;font-size:.95em}
table.lt th,table.lt td{border:1px solid var(--line);padding:8px 11px;text-align:left}
table.lt th{background:var(--sunk);color:var(--body);font-weight:600}
.callout{background:var(--sea-soft);border-left:3px solid var(--c,var(--sea));border-radius:10px;padding:11px 15px;margin:0 0 14px;font-size:.95em}
details{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:9px 14px;margin:0 0 12px;font-size:.95em}
details summary{cursor:pointer;font-weight:600;font-size:.9em;color:var(--body)}
details[open] summary{margin-bottom:8px}
.qa{margin:0 0 14px}.qa .q{font-weight:600;margin-bottom:8px}
.shown{background:var(--sunk);border-radius:12px;padding:11px 15px;margin:0 0 14px}
.shown .lab{font-size:.85em;color:var(--faint);font-weight:600;margin-bottom:4px}
.match{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;max-width:460px;margin:0 0 12px}
.match select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit}
.match .mk{font-weight:800;font-size:1.05em}

/* 내 기록 */
.pf-list{display:flex;flex-direction:column;gap:10px}
.pf-card{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
a.pf-card:hover{border-color:var(--c)}
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.pf-top b{font-size:16px}
.pf-score{flex:none;font-size:13px;background:var(--sunk);border-radius:9px;padding:5px 10px}
.pf-score b{color:var(--c);font-size:15px}
.pf-sum{font-size:14.5px;color:var(--body);white-space:pre-wrap;line-height:1.65}
.pf-q{margin-top:8px;font-size:13px;color:var(--faint)}

/* 선생님 대시보드 */
.dash-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dash-tools{display:flex;gap:8px;flex-wrap:wrap}
.dash-filters{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px}
.dash-filters label,.pick{font-size:13.5px;color:var(--body);display:flex;align-items:center;gap:8px}
.dash select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:12.5px;color:var(--faint)}
.tile b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.tile small{font-size:13px;color:var(--faint);font-weight:500}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 13px;font-weight:600;font-size:14px;color:var(--faint);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--sea);border-bottom-color:var(--sea)}
.tabs .bd{font-size:11px;background:var(--sea);color:var(--on-sea);border-radius:99px;padding:0 6px;line-height:17px;font-weight:700}
.dtools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:var(--body);cursor:pointer}
.rows{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:100px 1fr 84px;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.drow .who b{display:block;font-size:14.5px}
.drow .who span{font-size:12px;color:var(--faint)}
.drow .txt{font-size:14.5px;line-height:1.65}
.drow .txt .body{white-space:pre-wrap;display:block}
.drow.miss .txt .body{color:var(--coral)}
.drow.miss{border-style:dashed}
.drow .sc{font-size:12.5px;text-align:right}
.drow .sc b{font-size:15px;color:var(--sea)}
.tm{font-size:12px;color:var(--faint);margin-top:6px;white-space:normal}
.kw{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.kw span{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--faint)}
.kw span.hit{border-color:var(--ok);color:var(--ok)}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 200px 90px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.item .iq{font-size:14.5px}
.item .ans{display:inline;background:none;padding:0;margin:0 0 0 6px;font-size:12px;color:var(--faint)}
.ibar{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.ibar i{display:block;height:100%;background:var(--sea);border-radius:99px}
.item.low .ibar i{background:var(--coral)}
.item.low .ip b{color:var(--coral)}
.ip{text-align:right;font-size:12.5px;color:var(--faint)}
.ip b{font-size:16px;color:var(--ink)}
.oxd{font-size:12px;color:var(--faint);letter-spacing:.05em;margin-top:2px}
.fbx{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sbs{display:flex;gap:3px}
.sbs button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-size:13px;font-weight:700;color:var(--body)}
.sbs button:hover{border-color:var(--sea)}
.sbs button.on{background:var(--sea);color:var(--on-sea);border-color:transparent}
.fbx select,.fbx input{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:13px}
.fbx input{flex:1;min-width:160px}
.fbx .st{font-size:12px;color:var(--faint)}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;display:flex;gap:12px}
.qrow .who{flex:none;width:90px}.qrow .who b{display:block;font-size:14px}.qrow .who span{font-size:12px;color:var(--faint)}
.qrow .qt{flex:1;line-height:1.65;font-size:14.5px;white-space:pre-wrap}
.pick{margin-bottom:12px}

@media (max-width:820px){
  .read.has-img{grid-template-columns:1fr;gap:14px}
  .read-img img,figure img{max-height:30dvh}
}
@media (max-width:720px){
  .tiles{grid-template-columns:1fr 1fr}
  .drow{grid-template-columns:1fr auto}
  .drow .txt{grid-column:1 / -1;grid-row:2}
  .item{grid-template-columns:1fr auto}
  .item .ibar{grid-column:1 / -1}
  .qrow{flex-direction:column;gap:4px}
}
@media (max-width:620px){
  main{padding:20px 14px 48px}
  .bar{padding:0 12px}
  .uname .nm{display:none}
  .userbox .btn .tx{display:none}
  h1{font-size:22px}
  .step{flex-wrap:wrap}
  .step .acts{width:100%}
  .step .acts .btn{flex:1;justify-content:center}
  .urow .mini{display:none}
  .lesson{padding:0 12px}
  .ls-tools .tx{display:none}
  .stp{font-size:11.5px}
  .stitle{font-size:1.35em;margin-bottom:12px}
  .ls-nav .btn{min-width:88px;padding:10px 12px}
  .oxq .qt{font-size:1.2em;margin-bottom:22px}
  .toast{bottom:76px}
}
@media (max-height:640px){
  .stitle{margin-bottom:8px}
  .oxq .qt{margin-bottom:14px;min-height:0}
  .oxbtn{width:84px;height:84px;font-size:38px}
}

/* 보충 */
.rbody .pts{padding:0;margin:0 0 12px}
.dn-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@media (hover:none){.hintkey{display:none}}
.sumbox .stitle{font-size:1.25em}

.ls-stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,var(--paper));pointer-events:none;opacity:0;transition:opacity .2s}
.ls-stage.scr::after{opacity:1}
.dn-row .st{border:1px solid var(--line)}
.dn-row.ok .st{border-color:transparent}
@media (max-width:820px){
  .read{gap:10px}
  .read-img img,figure img{max-height:25dvh}
  .read-img a,figure a{padding:5px}
  figure{margin-bottom:4px}
  figcaption{margin-top:5px;font-size:.78em}
  .pts{gap:7px}
  .pts li{padding:8px 12px;font-size:.94em;line-height:1.55}
}

/* 읽기 장: 가로로 넓은 그림은 위에 크게, 글은 아래로 (세로로 긴 그림은 옆에 두기) */
.read.has-img{grid-template-columns:1fr;gap:14px;align-items:start}
.read.has-img.tall{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
.read-img{text-align:center}
.read-img a{display:block;margin:0 auto}
.read-img img{max-height:calc(100dvh - 400px);min-height:150px;margin:0 auto;width:auto;max-width:100%}
.read.has-img.tall .read-img img{max-height:calc(100dvh - 300px)}
.read.has-img:not(.tall) .pts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){
  .read.has-img.tall{grid-template-columns:1fr}
  .read.has-img:not(.tall) .pts{grid-template-columns:1fr}
  .read-img img{max-height:30dvh}
  .read.has-img.tall .read-img img{max-height:30dvh}
}
@media (max-height:760px) and (min-width:821px){
  .read-img img{max-height:calc(100dvh - 440px);min-height:130px}
  .read.has-img{gap:8px}
  .pts li{padding:8px 12px;line-height:1.55}
}


/* ===== 밤하늘 · 메인 ===== */
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
body.sky-on #sky{display:block}
body.sky-on{background:linear-gradient(180deg,#050b14 0%,#0a1822 55%,#0c2230 100%) fixed}
:root[data-theme="light"] body.sky-on{background:linear-gradient(180deg,#dfeaf3 0%,#eef4f8 60%,#e3f0ef 100%) fixed}
html:has(body.sky-on){background:#050b14}
:root[data-theme="light"] html:has(body.sky-on){background:#dfeaf3}
header,main,footer{position:relative;z-index:1}
header{z-index:20}
body.sky-on header{background:color-mix(in srgb,var(--head) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.sky-on .subj,body.sky-on .lk,body.sky-on .todo,body.sky-on .urows{background:color-mix(in srgb,var(--surface) 62%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.hero{position:relative;text-align:center;padding:64px 18px 150px;margin:-26px calc(50% - 50vw) 6px;overflow:hidden;isolation:isolate}
.hero h1{margin:0;font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--strong);text-shadow:0 0 38px color-mix(in srgb,var(--sea) 45%,transparent)}
.hero .lead{max-width:30em;margin:16px auto 0;font-size:15.5px;line-height:1.65}
/* 지구의 가장자리: 화면 아래에서 둥글게 떠오르는 대기 */
.hero::before{content:"";position:absolute;z-index:-1;left:50%;top:calc(100% - 84px);width:max(190%,1500px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 50% 0%,rgba(98,207,194,.30) 0,rgba(22,78,104,.85) 5%,#0b2233 16%,var(--paper) 42%);
  box-shadow:0 -1px 0 rgba(170,245,235,.75),0 -12px 40px rgba(98,207,194,.45),0 -40px 120px rgba(98,207,194,.18)}
:root[data-theme="light"] .hero::before{background:radial-gradient(circle at 50% 0%,rgba(10,125,115,.28) 0,rgba(120,185,200,.55) 6%,#cfe3ec 18%,var(--paper) 44%);box-shadow:0 -1px 0 rgba(10,125,115,.55),0 -14px 44px rgba(10,125,115,.22)}
.hero::after{content:"";position:absolute;z-index:-1;left:50%;bottom:20px;width:min(560px,90%);height:90px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(98,207,194,.35),transparent 70%);filter:blur(6px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.hero h1,.hero .lead{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .lead{animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.subjs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.subj{position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s}
.subj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.subj:hover{transform:translateY(-3px);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 28%,transparent)}
.lk{transition:transform .18s,border-color .18s,box-shadow .18s}
.lk:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--sea) 20%,transparent)}
@media (max-width:640px){
  .hero{padding:44px 18px 120px}
  .hero::before{top:calc(100% - 64px)}
}

body.sky-on{overflow-x:clip}

.hero{-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);padding-bottom:170px}
@media (max-width:640px){.hero{padding-bottom:135px}}


.urow.lock{opacity:.55;cursor:default}
.urow.lock .tag{display:inline-flex;align-items:center;gap:4px}
.urow.lock .tag svg{width:14px;height:14px}
.oppanel{margin:0 0 18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.oprow-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
.oprow-top label{display:flex;align-items:center;gap:6px}
.mini-note{font-size:.8em;color:var(--faint)}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 14px}
.opitem{display:flex;align-items:flex-start;gap:8px;padding:6px 4px;cursor:pointer}
.opitem small{color:var(--faint)}

<body>
<canvas id="sky" aria-hidden="true"></canvas>

<header>
  <div class="bar">
    <a class="brand" href="#/">
      <img src="https://earth516.github.io/lab-reports/assets/images/sj-science-logo.png" alt="" onerror="this.remove()">
      <b class="site-title">SJ SCIENCE</b>
    </a>
    <div class="spacer"></div>
    <div class="userbox" id="userbox"></div>
  </div>
</header>

<main id="app"></main>

<footer>
  <span id="foot"></span>
</footer>

<!-- 로그인 창 -->
<div class="modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <form class="panel" id="login-form">
    <h3 id="login-title">로그인</h3>
    <p class="hint">선생님께 받은 학번과 비밀번호로 로그인하세요.<br>로그인하면 학습 기록이 저장돼요.</p>
    <label for="login-id">학번</label>
    <input id="login-id" inputmode="numeric" autocomplete="username">
    <label for="login-pw">비밀번호</label>
    <input id="login-pw" type="password" autocomplete="current-password">
    <p class="err" id="login-err"></p>
    <div class="row">
      <button type="button" class="btn ghost" data-close>닫기</button>
      <button class="btn primary" id="login-btn">로그인</button>
    </div>
  </form>
</div>

<!-- 비밀번호 변경 창 -->
<div class="modal" id="pw-modal" role="dialog" aria-modal="true" aria-labelledby="pw-title">
  <form class="panel" id="pw-form">
    <h3 id="pw-title">비밀번호 바꾸기</h3>
    <p class="hint">새 비밀번호는 4자 이상으로 정해 주세요.</p>
    <label for="pw-old">지금 비밀번호</label>
    <input id="pw-old" type="password" autocomplete="current-password">
    <label for="pw-new">새 비밀번호</label>
    <input id="pw-new" type="password" autocomplete="new-password">
    <label for="pw-new2">새 비밀번호 확인</label>
    <input id="pw-new2" type="password" autocomplete="new-password">
    <p class="err" id="pw-err"></p>
    <div class="row">
      <button type="button" class="btn ghost" data-close>닫기</button>
      <button class="btn primary" id="pw-btn">바꾸기</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TYPE = {
  video: { label: '개념', icon: 'video', open: '영상 보기' },
  lab:   { label: '탐구', icon: 'flask', open: '실험하기' },
  quiz:  { label: '문제', icon: 'note',  open: '문제 풀기' },
  note:  { label: '정리', icon: 'book',  open: '자료 보기' },
};
const DEMO = !API_URL;
const LS_SESSION = 'sjhub.session';
const LS_DEMO = 'sjhub.demo';

document.title = SITE.title;
document.querySelectorAll('.site-title').forEach(el => el.textContent = SITE.title);
$('foot').innerHTML = `© ${esc(SITE.teacher)} · 오류 제보 <a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a> · <a href="${esc(SITE.youtube)}" target="_blank" rel="noopener">YouTube</a>`;

/* ---------- 데이터 찾기 ---------- */
const subjectById = id => SUBJECTS.find(s => s.id === id);
const allUnits = s => s.chapters.flatMap(c => c.units);

/* ---------- 서버와 통신 ---------- */
async function api(action, data = {}) {
  if (DEMO) return demoApi(action, data);
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // 구글 서버와 통신할 때 필요한 형식
    body: JSON.stringify({ action, token: session && session.token, ...data }),
  });
  const r = await res.json();
  if (r.error === 'EXPIRED') { endSession('로그인 시간이 지났어요. 다시 로그인해 주세요.'); throw new Error('EXPIRED'); }
  return r;
}

/* 체험 모드: 서버 없이 이 브라우저 안에서만 흉내 냅니다. */
function demoApi(action, d) {
  const db = lsGet(LS_DEMO) || { pw: '1234', done: [] };
  const save = () => lsSet(LS_DEMO, db);
  if (action === 'login') {
    if (d.id === 'teacher' && d.pw === '1234') return { ok: true, token: 'demo', id: 'teacher', name: '선생님', role: '교사', done: [] };
    if (d.id !== '10101' || d.pw !== db.pw) return { ok: false, error: '학번 또는 비밀번호가 맞지 않아요. (체험용 학생 10101 / 1234, 선생님 teacher / 1234)' };
    return { ok: true, token: 'demo', id: '10101', name: '체험학생', done: db.done };
  }
  if (action === 'progress') return { ok: true, done: db.done };
  if (action === 'mark') {
    const s = new Set(db.done); d.on ? s.add(d.key) : s.delete(d.key); db.done = [...s]; save();
    return { ok: true };
  }
  if (action === 'changePw') {
    if (d.oldPw !== db.pw) return { ok: false, error: '지금 비밀번호가 맞지 않아요.' };
    db.pw = d.newPw; save(); return { ok: true };
  }
  const withFb = (unit, n) => ({ ...(n || {}), ...((db.fb || {})['10101|' + unit] || {}) });
  if (action === 'myNotes') {
    const all = {}; const units = new Set([...Object.keys(db.notes || {}), ...Object.keys(db.fb || {}).filter(k => k.startsWith('10101|')).map(k => k.slice(6))]);
    units.forEach(u => all[u] = withFb(u, (db.notes || {})[u])); return { ok: true, notes: all };
  }
  if (action === 'notes') return { ok: true, notes: withFb(d.unit, (db.notes || {})[d.unit]) };
  if (action === 'saveNote') {
    db.notes = db.notes || {}; db.notes[d.unit] = db.notes[d.unit] || {};
    db.times = db.times || {}; const tk = d.unit + '|' + d.field, now = new Date().toISOString();
    if (['ox', 'oxDetail'].includes(d.field) && db.notes[d.unit][d.field]) return { ok: true };   // OX는 처음 기록 유지
    db.notes[d.unit][d.field] = d.text;
    db.times[tk] = { first: (db.times[tk] || {}).first || now, last: now };
    save(); return { ok: true };
  }
  if (action === 'dash') return demoDash(db);
  if (action === 'gradeOx') {   // 체험 모드: 예시 파일의 정답으로 채점
    const key = curUnit.L.steps.flatMap(st => st.blocks).find(b => b.ox).ox;
    const results = key.map((o, i) => ({ ok: d.picks[i] === (o.a ? 'O' : 'X'), a: o.a ? 'O' : 'X', exp: o.exp }));
    const score = `${results.filter(r => r.ok).length}/${results.length}`;
    db.notes = db.notes || {}; db.notes[d.unit] = db.notes[d.unit] || {};
    if (db.notes[d.unit].ox) return { ok: true, results, score, recorded: false, kept: db.notes[d.unit].ox };
    const now = new Date().toISOString(); db.times = db.times || {};
    db.notes[d.unit].ox = score; db.notes[d.unit].oxDetail = results.map(r => r.ok ? '1' : '0').join('');
    db.times[d.unit + '|ox'] = db.times[d.unit + '|oxDetail'] = { first: now, last: now };
    save(); return { ok: true, results, score, recorded: true };
  }
  if (action === 'feedback') {
    db.fb = db.fb || {}; const fk = d.sid + '|' + d.unit;
    db.fb[fk] = { fbScore: d.score, fbComment: d.comment }; save(); return { ok: true };
  }
  if (action === 'logout') return { ok: true };
  return { ok: false, error: '알 수 없는 요청' };
}

/* 체험용 대시보드 자료: 가상의 학생들 + 이 브라우저에서 체험학생(10101)이 남긴 기록 */

    ['10106', '최바람'], ['10107', '한별'], ['10201', '오지구'], ['10202', '윤태양']].map(([id, name]) => ({ id, name }));
  const fake = {
    '10102': ['저위도는 에너지가 남고 고위도는 부족해서 대기 대순환이 생긴다. 위도 0~30°에는 무역풍, 30~60°에는 편서풍이 불고 이 바람이 표층 해류를 만든다.', '11111', '2026-11-20T09:12', '2026-11-20T09:12'],
    '10103': ['무역풍은 동쪽에서 서쪽으로 불어서 적도 부근 해류도 서쪽으로 흐른다. 편서풍대에서는 해류가 동쪽으로 흐른다.', '11011', '2026-11-20T09:15', '2026-11-20T20:41'],
    '10104': ['바람 때문에 해류가 생긴다.', '10001', '2026-11-20T09:20', '2026-11-20T09:20'],
    '10105': ['위도에 따라 받는 태양 에너지가 달라서 열을 옮기는 대기 대순환이 일어나고, 지구 자전 때문에 무역풍·편서풍·극동풍이 생긴다. 표층 해류는 이 바람을 따라 흐르고 북반구에서는 시계 방향으로 순환한다.', '11111', '2026-11-20T09:18', '2026-11-21T08:02'],
    '10106': [null, '11001'],
    '10201': ['편서풍이 부는 곳에서는 북태평양 해류가 서에서 동으로 흐르고, 무역풍대에서는 북적도 해류가 동에서 서로 흐른다.', '10111', '2026-11-21T10:05', '2026-11-21T10:05'],
  };
  const notes = [];
  Object.entries(fake).forEach(([id, [sum, det, first, last]]) => {
    const name = students.find(s => s.id === id).name, t = first || '2026-11-20T09:30';
    if (sum) notes.push({ id, name, unit: U, field: 'summary', text: sum, first, last });
    notes.push({ id, name, unit: U, field: 'oxDetail', text: det, first: t, last: t });
    notes.push({ id, name, unit: U, field: 'ox', text: `${[...det].filter(c => c === '1').length}/${det.length}`, first: t, last: t });
  });
  const conf = { '10102': '해류가 도는 방향 (북반구·남반구)', '10103': '무역풍·편서풍의 방향', '10104': '무역풍·편서풍의 방향', '10105': '헷갈린 것 없음', '10106': '난류·한류가 흐르는 위치', '10201': '무역풍·편서풍의 방향' };
  const qdemo = { '10103': '북반구와 남반구에서 해류가 도는 방향이 왜 다른가요?', '10201': '쿠로시오 해류가 우리나라 날씨에도 영향을 주나요?' };
  Object.entries(qdemo).forEach(([id, text]) => notes.push({ id, name: students.find(s => s.id === id).name, unit: U, field: 'question', text, first: '2026-11-21T10:10', last: '2026-11-21T10:10' }));
  Object.entries(conf).forEach(([id, text]) => notes.push({ id, name: students.find(s => s.id === id).name, unit: U, field: 'confuse', text }));
  Object.entries(db.fb || {}).forEach(([fk, v]) => { const [id, ...rest] = fk.split('|'), unit = rest.join('|');
    Object.entries(v).forEach(([field, text]) => notes.push({ id, name: '', unit, field, text })); });
  Object.entries(db.notes || {}).forEach(([unit, fields]) => Object.entries(fields).forEach(([field, text]) => {
    const t = (db.times || {})[unit + '|' + field] || {};
    notes.push({ id: '10101', name: '체험학생', unit, field, text, first: t.first, last: t.last });
  }));
  return { ok: true, students, notes };
}

/* ---------- 로그인 / 로그아웃 ---------- */
function openModal(id) {
  $(id).classList.add('show');
  $(id).querySelectorAll('input').forEach(i => i.value = '');
  $(id).querySelector('.err').textContent = '';
  const saved = lsGet('sjhub.lastId');
  if (id === 'login-modal' && saved) $('login-id').value = saved;
  setTimeout(() => $(id).querySelector(saved && id === 'login-modal' ? '#login-pw' : 'input').focus(), 30);
}
function closeModal(el) { el.closest('.modal').classList.remove('show'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(b));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show')); });

$('login-form').onsubmit = async e => {
  e.preventDefault();
  const id = $('login-id').value.trim(), pw = $('login-pw').value.trim();
  if (!id || !pw) { $('login-err').textContent = '학번과 비밀번호를 모두 입력해 주세요.'; return; }
  const btn = $('login-btn'); btn.disabled = true; btn.textContent = '확인 중…'; $('login-err').textContent = '';
  try {
    const r = await api('login', { id, pw });
    if (!r.ok) throw new Error(r.error || '로그인에 실패했어요.');
    session = { token: r.token, id: r.id, name: r.name, role: r.role || '' };
    lsSet(LS_SESSION, session); lsSet('sjhub.lastId', r.id);
    done = new Set(r.done || []); loadDrafts();
    $('login-modal').classList.remove('show');
    toast(r.role === '교사' ? `${r.name}, 반가워요!` : `${r.name} 학생, 반가워요!`);
    if (r.role === '교사' && !location.hash.startsWith('#/dash')) location.hash = '#/dash';
    renderUser(); route();
    if (!DEMO) loadContent().then(() => { if (!document.querySelector('.lesson')) route(); });   // 내 반·과목에 맞는 단원으로 다시 불러오기
  } catch (err) {
    $('login-err').textContent = /fetch/i.test(err.message) ? '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.' : err.message;
  } finally { btn.disabled = false; btn.textContent = '로그인'; }
};

$('pw-form').onsubmit = async e => {
  e.preventDefault();
  const oldPw = $('pw-old').value.trim(), newPw = $('pw-new').value.trim(), newPw2 = $('pw-new2').value.trim();
  const err = t => $('pw-err').textContent = t;
  if (!oldPw || !newPw) return err('빈칸을 모두 채워 주세요.');
  if (newPw.length < 4) return err('새 비밀번호는 4자 이상이어야 해요.');
  if (newPw !== newPw2) return err('새 비밀번호가 서로 달라요.');
  const btn = $('pw-btn'); btn.disabled = true;
  try {
    const r = await api('changePw', { oldPw, newPw });
    if (!r.ok) throw new Error(r.error);
    $('pw-modal').classList.remove('show'); toast('비밀번호를 바꿨어요.');
  } catch (e2) { if (e2.message !== 'EXPIRED') err(e2.message || '바꾸지 못했어요.'); }
  finally { btn.disabled = false; }
};

function endSession(msg, explicit) {
  session = null; done = new Set(); dashData = null; lsSet(LS_SESSION, null);
  [drafts, notes, lessonState].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  if (explicit) lsSet('sjhub.drafts', null);   // 직접 로그아웃하면 이 기기에 남은 임시 글도 지워요
  renderUser(); route();
  if (!DEMO) { lsSet('sjhub.content', null); loadContent().then(() => { if (!document.querySelector('.lesson')) route(); }); }
  if (msg) { toast(msg); openModal('login-modal'); }
}

      : `<button class="btn primary" onclick="openLogin()">로그인</button>`);
}

/* ---------- 완료 체크 (링크형 단원) ---------- */
window.toggleStep = async key => {
  if (!session) { toast('로그인하면 학습 기록을 저장할 수 있어요.'); openModal('login-modal'); return; }
  const on = !done.has(key);
  on ? done.add(key) : done.delete(key);
  refreshDone();
  try {
    const r = await api('mark', { key, on });
    if (!r.ok) throw new Error(r.error);
  } catch (e) {
    on ? done.delete(key) : done.add(key);
    refreshDone();
    if (e.message !== 'EXPIRED') toast('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.');
  }
};

/* ---------- 진도 계산 ---------- */
function itemsOf(s, u) {
  const L = u.lesson && LESSONS[u.lesson];
  if (L) return L.steps.map(st => ({ key: `${s.id}|${u.code}|${st.id}`, icon: LT[st.type].icon }));
  return (u.steps || []).map(st => ({ key: stepKey(s, u, st), icon: TYPE[st.type].icon }));
}
function progressOf(s, units) {
  let total = 0, n = 0;
  units.forEach(u => itemsOf(s, u).forEach(it => { total++; if (done.has(it.key)) n++; }));
  return { total, n, pct: total ? Math.round(n / total * 100) : 0 };
}
const bar = (p, showText = true) => `<div class="prog"><i style="width:${p.pct}%"></i></div>${showText ? `<div class="prog-t">${p.n} / ${p.total} 활동 완료</div>` : ''}`;
const posOf = key => (lsGet('sjhub.pos') || {})[key] || 0;

/* ============================================================
   홈 · 과목 · 링크형 단원
   ============================================================ */
const lk = (url, icon, title, desc) => `<a class="lk" href="${esc(url)}" target="_blank" rel="noopener">${ic(icon)}<div><b>${title}</b><span>${desc}</span></div></a>`;

function viewHome() {
  return `
    ${DEMO ? `<div class="banner"><b>체험 모드</b> · 아직 구글 시트와 연결되지 않았어요. 학생은 <b>10101</b> / <b>1234</b>, 선생님은 <b>teacher</b> / <b>1234</b>로 로그인해 볼 수 있고, 기록은 이 브라우저에만 저장돼요.</div>` : ''}
    ${viewTodo()}
    <h2>과목</h2>
    <div class="subjs">
      ${SUBJECTS.map(s => {

          <div class="tile-ic">${subjIcon(s)}</div>
          <div class="t"><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div>

      ${lk(LINKS.earthBank, 'globe', '지구과학 문제은행', '문제풀기 · 빈칸 · OX · 서술형')}

/* 홈: 학생 할 일 + 내 현황 */
function viewTodo() {
  if (!session || isTeacher()) return '';
  const list = lessonUnits().map(x => ({ ...x, p: progressOf(x.s, [x.u]) })).filter(x => x.p.n < x.p.total);
  setTimeout(loadMyStat, 0);
  return `<div class="todo"><h2>${ic('target')} 오늘 할 일</h2>
    ${list.length ? `<ul>${list.map(x => `<li><a href="#/${x.s.id}/${encodeURIComponent(x.u.code)}" style="--c:${sc(x.s)}"><span>${esc(x.u.title)} <small>${esc(x.s.title)} ${esc(x.u.code)}</small></span><small>${posOf(x.key) > 0 ? '이어하기 · ' : ''}${x.p.n}/${x.p.total} 완료</small></a></li>`).join('')}</ul>`
      : `<div class="clear">${ic('check-circle')} 지금 할 점검을 모두 마쳤어요!</div>`}
    <div class="mystat" id="mystat"></div><div class="fbnote" id="fbnote"></div></div>`;
}
async function loadMyStat() {
  try {
    const r = await api('myNotes'); if (!r.ok) return;
    const all = r.notes || {}, units = lessonUnits();
    const vals = units.map(x => all[x.key] || {});
    const ox = vals.map(n => n.ox).filter(Boolean).map(o => { const [g, t] = o.split('/').map(Number); return t ? g / t : 0; });
    const sub = vals.filter(n => n.summary).length, fb = vals.filter(n => n.fbScore || n.fbComment).length;
    const ms = $('mystat');
    if (ms) ms.innerHTML = `<span>개념 정리 <b>${sub}</b> / ${units.length}</span><span>OX 평균 <b>${ox.length ? Math.round(ox.reduce((a, b) => a + b, 0) / ox.length * 100) + '%' : '-'}</b></span>${fb ? `<span>선생님 피드백 <b>${fb}</b></span>` : ''}`;
    const el = $('fbnote'); if (el && fb) el.innerHTML = `선생님 피드백이 ${fb}개 있어요. <a href="#/me">내 기록에서 보기</a>`;
  } catch { }
}

function unitRow(s, u) {
  if (u.locked) return `<span class="urow lock"><span class="code">${esc(u.code)}</span><span class="t">${esc(u.title)}</span><span class="tag">${ic('lock')} ${u.week ? esc(u.week) + '주차에 열려요' : '아직 안 열렸어요'}</span></span>`;
  const p = progressOf(s, [u]), L = u.lesson && LESSONS[u.lesson];
  const end = session && p.total ? (p.n === p.total ? `<span style="color:var(--ok)">${ic('check-circle')}</span>` : p.n ? `<span class="mp"><i style="width:${p.pct}%"></i></span>` : '') : '';
  return `<a class="urow" href="#/${s.id}/${encodeURIComponent(u.code)}">
    <span class="code">${esc(u.code)}</span><span class="t">${esc(u.title)}</span>
    ${L ? `<span class="tag">${esc(L.time || '5분')} 점검</span>` : `<span class="mini">${itemsOf(s, u).map(it => ic(it.icon)).join('')}</span>`}
    <span class="end">${end}${ic('right')}</span></a>`;
}
function viewSubject(s) {

    <div class="crumbs"><a href="#/">홈</a>${ic('right')}${esc(s.title)}</div>

    <p class="lead">${esc(s.desc)} · 단원을 골라 시작해요.</p>

      <div class="urows" style="--c:${sc(s)}">${c.units.map(u => unitRow(s, u)).join('')}</div>`).join('')}`;

function viewUnit(s, u) {

    <ol class="steps" style="--c:${sc(s)}">

          <div class="acts">

            <button class="btn check ${on ? 'on' : ''}" data-key="${esc(key)}" onclick="toggleStep(this.dataset.key)">${on ? '완료함' : '완료'}</button>
          </div>
        </li>`;
      }).join('')}

/* ============================================================
   단원 점검 (lessons 폴더·시트의 내용을 '한 화면에 한 장씩' 보여 줌)
   - 개념 보기 → 정리 쓰기 → 뉴스 → OX(문제 하나씩) → 결과 → 헷갈린 개념·질문 → 마무리
   - 정리 글을 저장하거나, 뉴스 설명을 보거나, OX를 제출하면 그 단계가 자동으로 '완료'돼요.
   ============================================================ */
const LT = {
  observe: { icon: 'eye', label: '관찰' },
  ask: { icon: 'help', label: '질문' },
  concept: { icon: 'book', label: '개념 정리' },
  explore: { icon: 'flask', label: '탐구' },
  news: { icon: 'news', label: '세상과 연결' },
  check: { icon: 'check-circle', label: 'OX 확인' },
  reflect: { icon: 'refresh', label: '돌아보기' },
};
const notes = {};    // notes['과목|단원|항목'] = 저장된 글
const drafts = {};   // 아직 저장 안 한 글 (다시 그려도 사라지지 않게)
let curUnit = null;  // 지금 보고 있는 단원 { s, u, L, unitKey, st }
const lessonState = {};   // 단원별로 기억해 둘 것: { cur(보던 쪽), oxs(OX 고른 답) }
let pages = [], pageIdx = 0;

/* 쓰던 글은 이 기기에 임시로 남겨 둬요 (새로고침해도 안 사라지게 · 로그아웃하면 지워요) */
const draftKey = k => session.id + '|' + k;
function loadDrafts() {
  if (!session) return;
  const d = lsGet('sjhub.drafts') || {};
  Object.entries(d).forEach(([dk, v]) => { if (dk.startsWith(session.id + '|')) drafts[dk.slice(session.id.length + 1)] = v; });
}
function persistDraft(k, v) {
  if (!session) return;
  const d = lsGet('sjhub.drafts') || {};
  if (v) d[draftKey(k)] = v; else delete d[draftKey(k)];
  lsSet('sjhub.drafts', Object.keys(d).length ? d : null);
}

function loadLessons() {
  const names = [...new Set(SUBJECTS.flatMap(s => allUnits(s)).map(u => u.lesson).filter(Boolean))];
  return Promise.all(names.map(n => new Promise(res => {
    const el = document.createElement('script');
    el.src = `lessons/${n}.js`;
    el.onload = res;
    el.onerror = () => { console.warn('수업 파일을 찾을 수 없어요:', n); res(); };
    document.head.appendChild(el);
  })));
}

/* 시트(단원·OX·뉴스·헷갈린개념 탭)에서 내용 불러오기 — 체험 모드에서는 lessons 폴더의 예시 파일을 씁니다. */
async function loadContent() {
  if (DEMO) return loadLessons();
  SUBJECTS.forEach(s => s.chapters.forEach(c => c.units = c.units.filter(u => !u.lesson)));
  const cached = lsGet('sjhub.content');
  if (cached) applyContent(cached);
  const fresh = api('content').then(r => {
    if (!r.ok) return;
    const changed = !cached || JSON.stringify(r.units) !== JSON.stringify(cached.units);
    lsSet('sjhub.content', r); applyContent(r);
    if (cached && changed && !document.querySelector('.lesson')) route();
  }).catch(() => { });
  if (!cached) await fresh;
}
function applyContent(data) {
  SUBJECTS.forEach(s => {
    s.chapters.forEach(c => c.units = c.units.filter(u => !u.fromSheet));
    s.chapters = s.chapters.filter(c => !c.fromSheet || c.units.length);
  });
  (data.units || []).forEach(x => {
    const s = SUBJECTS.find(v => v.title === x.subject || v.id === x.subject);
    if (!s) return;
    s.chapters.forEach(c => c.units = c.units.filter(u => u.code !== x.code));
    let ch = s.chapters.find(c => c.title === x.chapter);
    if (!ch) { ch = { title: x.chapter || '기타', units: [], fromSheet: true }; s.chapters.push(ch); }
    const id = `sheet:${s.id}:${x.code}`;
    if (x.locked) ch.units.push({ code: x.code, title: x.title, locked: true, week: x.week, fromSheet: true });   // 아직 열리지 않은 단원
    else { LESSONS[id] = buildLesson(x, s); ch.units.push({ code: x.code, title: x.title, lesson: id, fromSheet: true }); }
    ch.units.sort((a, b) => a.code.localeCompare(b.code, 'ko', { numeric: true }));
  });
}
/* 시트의 한 단원 → 수업 구조 ( **굵게** 를 쓸 수 있어요) */
function buildLesson(x, s) {
  const md = t => esc(t || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  const steps = [{ id: 'concept', type: 'concept', title: '개념 정리', blocks: [
    ...(x.img ? [{ img: x.img, caption: x.imgCaption }] : []),
    ...(x.points.length ? [{ list: x.points.map(md) }] : []),
    { write: 'summary', label: '핵심 개념을 내 말로 2~3문장 정리해 보세요.', hint: x.hint, placeholder: '제시어를 넣어 정리해 보세요.', hasModel: x.hasModel },
  ] }];
  if (x.news.length) steps.push({ id: 'news', type: 'news', title: '세상과 연결',
    blocks: x.news.map(n => ({ news: { title: n.title, source: n.source, date: n.date, url: n.url, summary: md(n.summary), ask: md(n.ask), answer: md(n.answer) } })) });
  steps.push({ id: 'check', type: 'check', title: 'OX 확인', blocks: [
    ...(x.ox.length ? [{ ox: x.ox.map(o => ({ q: md(o.q) })) }] : []),
    ...(x.confuse.length ? [{ confuse: x.confuse }] : []),
    { question: true },
    ...(s.bank ? [{ links: [{ title: `문제은행 · ${x.title} 더 풀기`, desc: `SJ ${s.title} 문제은행 ${x.code}`, url: s.bank }] }] : []),
  ] });
  return { goal: x.goal, time: x.time, img: 'images/', steps };
}

/* 단계 안의 블록들을 '장'으로 나누기
   - 그림·글·표는 한 장(읽기)에 모으고, 쓰기·뉴스·OX 한 문제·헷갈린 개념·질문은 각각 한 장이에요.
   - 맨 끝의 링크 블록은 마무리 장으로 옮겨요. */
function buildPages(L) {
  const out = [], tail = [];
  L.steps.forEach((st, si) => {
    let blocks = st.blocks.map((b, bi) => ({ b, bid: `${st.id}-${bi}` }));
    if (si === L.steps.length - 1) { while (blocks.length && blocks[blocks.length - 1].b.links) tail.unshift(blocks.pop().b); }
    let group = [];
    const flush = () => { if (group.length) out.push({ kind: 'read', si, st, blocks: group }); group = []; };
    blocks.forEach(({ b, bid }) => {
      if (b.write) { flush(); out.push({ kind: 'write', si, st, b, bid }); }
      else if (b.news) { flush(); out.push({ kind: 'news', si, st, b, bid }); }
      else if (b.ox) { flush(); b.ox.forEach((q, i) => out.push({ kind: 'oxq', si, st, b, bid, i })); out.push({ kind: 'oxsum', si, st, b, bid }); }
      else if (b.confuse) { flush(); out.push({ kind: 'confuse', si, st, b, bid }); }
      else if (b.question) { flush(); out.push({ kind: 'question', si, st, b, bid }); }
      else group.push({ b, bid });
    });
    flush();
  });
  out.push({ kind: 'done', si: L.steps.length, st: { id: 'done', type: 'reflect' } });
  out.tail = tail;
  return out;
}

function nextLessonUnit(s, u) {
  const list = lessonUnits(), i = list.findIndex(x => x.u === u);
  return i >= 0 ? list[i + 1] : null;
}

function viewLesson(s, u, L) {
  if (!L) return `<div style="padding:26px 18px"><div class="crumbs"><a href="#/">홈</a>${ic('right')}<a href="#/${s.id}">${esc(s.title)}</a></div><p>수업 파일(lessons/${esc(u.lesson)}.js)을 찾을 수 없어요.</p></div>`;
  const unitKey = `${s.id}|${u.code}`;
  const st = lessonState[unitKey] = lessonState[unitKey] || { oxs: {}, cur: null, warned: {} };
  curUnit = { s, u, L, unitKey, st };
  pages = buildPages(L);
  if (st.cur == null || st.cur >= pages.length) {
    const saved = posOf(unitKey);
    st.cur = saved > 0 && saved < pages.length - 1 ? saved : 0;
    st.resumed = st.cur > 0;
  }
  pageIdx = st.cur;
  return `<div class="lesson" style="--c:${sc(s)}">
    <div class="ls-top">
      <a class="ls-back" href="#/${s.id}">${ic('left')}${esc(s.title)}</a>
      <div class="ls-title"><span class="code">${esc(u.code)}</span>${esc(u.title)}</div>
      <div class="ls-tools">${L.time ? `${ic('clock')}<span>${esc(L.time)}</span>` : ''}</div>
    </div>
    <div class="ls-steps" id="ls-steps"></div>
    <div class="ls-stage" id="ls-stage">
      ${pages.map((p, i) => `<section class="slide ${i === pageIdx ? 'on' : ''}" data-i="${i}" aria-label="${i + 1}쪽">${renderPage(p)}</section>`).join('')}
    </div>
    <div class="ls-nav">
      <button class="btn" id="ls-prev" onclick="go(pageIdx-1)">${ic('left')}이전</button>
      <div class="mid"><div class="dots" id="ls-dots" aria-hidden="true"></div><span id="ls-cnt"></span></div>
      <button class="btn primary" id="ls-next" onclick="go(pageIdx+1)">다음${ic('right')}</button>
    </div>
  </div>`;
}

/* ---------- 장 그리기 ---------- */
function kicker() { return ''; }   // 현재 단계는 위쪽 탭에 표시돼요

function renderPage(p) {
  switch (p.kind) {
    case 'read': return renderRead(p);
    case 'write': return renderWrite(p);
    case 'news': return renderNews(p);
    case 'oxq': return renderOxq(p);
    case 'oxsum': return `<div class="sin">${kicker(p)}<div class="sumbox" id="oxsum-${p.bid}">${oxSumHtml(p.bid)}</div></div>`;
    case 'confuse': return renderConfuse(p);
    case 'question': return renderQuestion(p);
    case 'done': return `<div class="sin"><div class="dn" id="done-body">${doneHtml()}</div></div>`;
  }
  return '';
}

window.imgShape = im => { const r = im.closest('.read'); if (r) r.classList.toggle('tall', im.naturalHeight > im.naturalWidth * 0.85); };
function renderRead(p) {
  const imgs = p.blocks.filter(x => x.b.img), rest = p.blocks.filter(x => !x.b.img);
  const R = x => renderBlock(x.b, curUnit.L, curUnit.unitKey, x.bid);
  return `<div class="sin">${kicker(p)}<div class="read ${imgs.length ? 'has-img' : ''}">
    ${imgs.length ? `<div class="read-img">${imgs.map(R).join('')}</div>` : ''}
    <div class="rbody">${rest.map(R).join('')}</div></div></div>`;
}

/* 블록 하나 그리기 — p·list·callout 안에는 <b> 같은 간단한 태그를 쓸 수 있어요 */
function renderBlock(b, L, unitKey, bid) {
  if (b.h) return `<h4>${b.h}</h4>`;
  if (b.p) return `<p>${b.p}</p>`;
  if (b.callout) return `<div class="callout">${ic('help')} ${b.callout}</div>`;
  if (b.img) { const src = /^https?:/.test(b.img) ? b.img : L.img + b.img;
    return `<figure><a href="${esc(src)}" target="_blank" rel="noopener" style="${b.width ? `max-width:${b.width}px;margin:0 auto` : ''}"><img src="${esc(src)}" alt="${esc(b.caption || '')}" loading="lazy" onload="imgShape(this)"></a>${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`; }

/* 쓰기 장 */

/* OX — 한 문제씩 고르고, 마지막에 제출하면 서버가 채점해요 (정답은 서버에만 있어요). 처음 제출한 결과만 기록 */
function oxState(bid) {
  const S = curUnit.st.oxs;
  if (!S[bid]) S[bid] = { picks: Array(blockOf(bid).ox.length).fill(null), graded: false, res: null };
  return S[bid];
}
const oxPageIdx = (bid, i) => pages.findIndex(p => p.kind === 'oxq' && p.bid === bid && p.i === i);
const oxSumIdx = bid => pages.findIndex(p => p.kind === 'oxsum' && p.bid === bid);
function renderOxq(p) {
  const q = p.b.ox[p.i], N = p.b.ox.length;
  return `<div class="sin">${kicker(p)}<div class="oxq"><div class="n">문제 ${p.i + 1} / ${N}</div><p class="qt">${q.q}</p>
    <div class="oxbtns"><button class="oxbtn o" data-v="O" onclick="pickOx('${p.bid}',${p.i},'O')" aria-label="O (맞다)">O</button><button class="oxbtn x" data-v="X" onclick="pickOx('${p.bid}',${p.i},'X')" aria-label="X (틀리다)">X</button></div>
    <div class="hintkey">키보드 O · X 로도 고를 수 있어요</div></div></div>`;
}
let oxTimer;
window.pickOx = (bid, i, v) => {
  const S = oxState(bid);
  if (S.graded) { toast('채점이 끝났어요. 다시 풀려면 결과 화면의 버튼을 눌러 주세요.'); return; }
  S.picks[i] = v; paintOx(bid);
  const from = pageIdx; clearTimeout(oxTimer);
  oxTimer = setTimeout(() => {   // 고르면 다음 안 푼 문제로 (다 풀었으면 제출 화면으로)
    if (pageIdx !== from) return;
    const j = S.picks.findIndex((x, k) => k > i && !x);
    go(j >= 0 ? oxPageIdx(bid, j) : oxSumIdx(bid), { force: true });
  }, 260);
};
function paintOx(bid) {
  const S = oxState(bid);
  pages.forEach((p, i) => {
    if (p.kind !== 'oxq' || p.bid !== bid) return;
    const sl = document.querySelector(`.slide[data-i="${i}"]`); if (!sl) return;
    sl.querySelectorAll('.oxbtn').forEach(btn => {
      const on = S.picks[p.i] === btn.dataset.v;
      btn.classList.toggle('sel', on);
      btn.classList.toggle('right', on && S.graded && !!S.res[p.i].ok);
      btn.classList.toggle('wrong', on && S.graded && !S.res[p.i].ok);

}
function renderOxSum(bid) { const el = $('oxsum-' + bid); if (el) el.innerHTML = oxSumHtml(bid); }
function oxSumHtml(bid) {
  const S = oxState(bid), qs = blockOf(bid).ox, N = qs.length, k = `${curUnit.unitKey}|ox`;
  if (!S.graded) {
    const got = S.picks.filter(Boolean).length;
    return `<h2 class="stitle">${got === N ? '다 풀었어요. 제출할까요?' : `아직 ${N - got}문제를 고르지 않았어요`}</h2>
      ${qs.map((q, i) => `<button class="sumrow" onclick="go(oxPageIdx('${bid}',${i}),{force:true})"><span class="ix">${i + 1}</span><span class="tx">${q.q}</span><span class="pk ${S.picks[i] ? '' : 'none'}">${S.picks[i] || '—'}</span></button>`).join('')}
      <div class="dn-acts"><button class="btn primary" id="ox-submit" ${got < N ? 'disabled' : ''} onclick="submitOx('${bid}')">${ic('check')} 제출하고 채점하기</button></div>
      ${notes[k] ? `<p class="muted" style="font-size:.85em">포트폴리오에 기록된 점수 <b>${esc(notes[k])}</b> · 다시 풀어도 기록은 바뀌지 않아요.</p>` : ''}`;
  }
  const wrong = S.res.filter(r => !r.ok).length;
  return `<div class="scorebox"><div class="big">${esc(S.score)}</div><div class="sub">${S.recorded
      ? `${ic('folder')} 포트폴리오에 기록했어요<br>(첫 번째 풀이)`
      : `이번 점수 ${esc(S.score)}<br>포트폴리오에는 첫 번째 풀이 <b>${esc(S.kept || notes[k] || '')}</b>가 남아 있어요`}</div></div>
    ${wrong ? `<div class="dn-acts" style="margin:0 0 12px"><button class="btn" onclick="retryWrong('${bid}')">${ic('refresh')} 틀린 문제만 다시 풀기</button></div>` : ''}
    ${S.res.map((r, i) => `<div class="res ${r.ok ? 'ok' : 'no'}"><span class="mk">${r.ok ? '✓' : '✗'}</span><div><div class="rq">${i + 1}. ${qs[i].q}</div>
      <div class="rx">${r.ok ? `정답 ${esc(r.a)}` : `내 답 ${esc(S.picks[i])} → 정답 ${esc(r.a)}`}${r.exp ? ' · ' + esc(r.exp) : ''}</div></div></div>`).join('')}`;
}
window.submitOx = async bid => {
  const S = oxState(bid); if (S.graded) return;
  if (S.picks.some(v => !v)) { toast('모든 문항에 O 또는 X를 골라 주세요.'); return; }
  if (!session) { toast('로그인하면 채점하고 점수를 기록할 수 있어요.'); openModal('login-modal'); return; }
  const btn = $('ox-submit'); if (btn) { btn.disabled = true; btn.textContent = '채점 중…'; }
  try {
    const r = await api('gradeOx', { unit: curUnit.unitKey, code: curUnit.u.code, picks: S.picks });
    if (!r.ok) throw new Error(r.error);
    S.graded = true; S.res = r.results; S.score = r.score; S.recorded = !!r.recorded; S.kept = r.kept;
    const k = `${curUnit.unitKey}|ox`;
    if (r.recorded) { notes[k] = r.score; autoDone(pages[oxSumIdx(bid)].st.id); } else if (r.kept && !notes[k]) notes[k] = r.kept;

};
window.retryWrong = bid => {
  const S = oxState(bid), wrong = S.res.map((r, i) => r.ok ? -1 : i).filter(i => i >= 0);

/* 마무리 장 */
function doneHtml() {
  const { s, u, unitKey } = curUnit, N = n => notes[`${unitKey}|${n}`];

  pages.forEach((p, i) => {

    else if (p.kind === 'oxsum') rows.push({ k: 'OX 확인', ok: !!N('ox'), v: N('ox') ? `${N('ox')} (첫 풀이)` : '아직이에요', i });
    else if (p.kind === 'confuse') rows.push({ k: '가장 헷갈린 개념', ok: !!N('confuse'), v: N('confuse') || '고르지 않았어요', i, opt: true });
    else if (p.kind === 'question' && N('question')) rows.push({ k: '선생님께 남긴 질문', ok: true, v: '전달함', i });

  const nx = nextLessonUnit(s, u);

    ${session ? '' : `<div class="banner">로그인하면 정리한 글과 OX 점수가 <b>포트폴리오</b>에 기록돼요. <button class="btn sm primary" style="margin-left:6px" onclick="openLogin()">로그인</button></div>`}

      ${nx ? `<a class="btn primary" href="#/${nx.s.id}/${encodeURIComponent(nx.u.code)}">다음 단원 · ${esc(nx.u.title)} ${ic('right')}</a>` : ''}
      <a class="btn" href="#/${s.id}">단원 목록</a>
      ${session && !isTeacher() ? `<a class="btn" href="#/me">${ic('folder')} 내 기록</a>` : ''}
      <button class="btn ghost" onclick="go(0,{force:true})">${ic('refresh')} 처음부터 다시 보기</button>
    </div>
    ${pages.tail && pages.tail.length ? `<h2 style="font-size:.95em">더 풀어 보기</h2>${pages.tail.map(b => renderBlock(b, curUnit.L, unitKey, 'tail')).join('')}` : ''}`;
}
function renderDonePage() { const el = $('done-body'); if (el && curUnit) el.innerHTML = doneHtml(); }

/* 블록 데이터 찾기 (bid = 단계id-블록번호) */
function blockOf(bid) {
  const i = bid.lastIndexOf('-');
  const st = curUnit.L.steps.find(x => x.id === bid.slice(0, i));

window.checkMatch = bid => {

    const v = box.querySelector(`select[data-i="${i}"]`).value, r = box.querySelector(`[data-r="${i}"]`);
    const good = v === ans; if (good) ok++;

window.go = (n, opts = {}) => {
  if (!curUnit) return;

  const nw = document.querySelector(`.slide[data-i="${n}"]`);

  pageIdx = n; curUnit.st.cur = n;

function scrollHint() {
  const stage = $('ls-stage'), sl = document.querySelector('.slide.on'); if (!stage || !sl) return;

async function loadNotes(s, u) {

/* ---------- 밤하늘 배경: 반짝이는 별 + 떨어지는 별똥별 ---------- */
const sky = (() => {
  const cv = document.getElementById('sky');
  if (!cv || !cv.getContext) return { set() {} };
  const g = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, stars = [], meteors = [], raf = 0, last = 0, nextMeteor = 0, on = false;

  const rgb = () => (getComputedStyle(document.documentElement).getPropertyValue('--sky-rgb').trim() || '255,255,255');
  const alphaK = () => (document.documentElement.dataset.theme === 'light' ? 0.55 : 1);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(190, Math.round(W * H / 7500));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < .15 ? rnd(1.4, 2.1) : rnd(.55, 1.25),
      ph: Math.random() * 6.28, sp: rnd(.6, 2.2), base: rnd(.35, .9),
      drift: rnd(2, 7),                       // 아주 천천히 아래로 흘러요 (px/초)
    }));
  }

  function spawn() {
    const len = rnd(110, 230), speed = rnd(520, 900);
    const ang = rnd(1.95, 2.25);               // 오른쪽 위에서 왼쪽 아래로 (라디안)
    meteors.push({
      x: rnd(W * .25, W * 1.05), y: rnd(-40, H * .35),
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      len, life: 0, max: rnd(.9, 1.5), w: rnd(1.2, 2.2),
    });
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
    const c = rgb(), k = alphaK();
    g.clearRect(0, 0, W, H);

    for (const s of stars) {
      s.y += s.drift * dt; if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
      const a = (s.base + Math.sin(t / 1000 * s.sp + s.ph) * .3) * k;
      g.fillStyle = `rgba(${c},${Math.max(.05, a).toFixed(3)})`;
      g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill();
    }

    nextMeteor -= dt;
    if (nextMeteor <= 0 && meteors.length < 4) { spawn(); nextMeteor = rnd(.7, 2.2); }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.life += dt;
      if (m.life > m.max || m.y > H + 60 || m.x < -60) { meteors.splice(i, 1); continue; }
      const fade = Math.min(1, m.life / .12) * Math.min(1, (m.max - m.life) / .35);
      const sp = Math.hypot(m.vx, m.vy), tx = m.x - m.vx / sp * m.len, ty = m.y - m.vy / sp * m.len;
      const gr = g.createLinearGradient(m.x, m.y, tx, ty);
      gr.addColorStop(0, `rgba(${c},${(.95 * fade * k).toFixed(3)})`);
      gr.addColorStop(.35, `rgba(150,230,225,${(.35 * fade * k).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(150,230,225,0)');
      g.strokeStyle = gr; g.lineWidth = m.w; g.lineCap = 'round';
      g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(tx, ty); g.stroke();
      g.fillStyle = `rgba(${c},${(fade * k).toFixed(3)})`;
      g.shadowColor = 'rgba(120,230,220,.9)'; g.shadowBlur = 10;
      g.beginPath(); g.arc(m.x, m.y, m.w * .9, 0, 6.2832); g.fill();
      g.shadowBlur = 0;
    }
  }

  function drawStill() {
    const c = rgb(), k = alphaK(); g.clearRect(0, 0, W, H);
    for (const s of stars) { g.fillStyle = `rgba(${c},${(s.base * k).toFixed(3)})`; g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.2832); g.fill(); }
  }

  function start() { if (raf || still) return; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  addEventListener('resize', () => { if (on) { size(); if (still) drawStill(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (on) start(); });

  return {
    set(v) {
      on = v; document.body.classList.toggle('sky-on', v);
      if (v) { size(); meteors = []; nextMeteor = .4; still ? drawStill() : start(); }
      else { stop(); g.clearRect(0, 0, W, H); }
    },
    refresh() { if (on && still) drawStill(); },
  };
})();

/* ============================================================

const isTeacher = () => session && session.role === '교사';

const lessonUnits = () => SUBJECTS.flatMap(s => allUnits(s).filter(u => u.lesson && LESSONS[u.lesson]).map(u => ({ s, u, key: `${s.id}|${u.code}`, L: LESSONS[u.lesson] })));
const classOf = id => /^\d{5}$/.test(id) ? `${id[0]}학년 ${Number(id.slice(1, 3))}반` : '기타';
const oxBlockOf = L => L.steps.flatMap(st => st.blocks).find(b => b.ox);
const hintOf = L => ((L.steps.flatMap(st => st.blocks).find(b => b.write === 'summary') || {}).hint || '').split(',').map(w => w.trim()).filter(Boolean);
function fmtTime(t) {
  if (!t) return '';
  const d = new Date(t);
  if (isNaN(d)) return String(t).replace(/:\d\d$/, '');
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function noteOf(id, unit, field) { return dashData.notes.find(n => n.id === id && n.unit === unit && n.field === field); }
const curStuds = () => dashData.students.filter(s => !dashState.cls || classOf(s.id) === dashState.cls).sort((a, b) => a.id.localeCompare(b.id));

/* ① 개념 정리 모아 읽기 · 채점 */
function dashRead(x, studs) {
